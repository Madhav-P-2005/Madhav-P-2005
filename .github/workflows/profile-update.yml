name: Update Profile

on:
  schedule:
    - cron: "0 0 * * *"        # Daily at midnight UTC
  workflow_dispatch:            # Manual trigger from Actions tab

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  # ── Job 1: Auto-generate profile summary cards ──
  generate-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_SUMMARY_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

  # ── Job 2: Generate custom SVGs (hero banner + heatmap) ──
  generate-svgs:
    runs-on: ubuntu-latest
    needs: generate-cards
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate hero banner
        run: python scripts/generate_banner.py

      - name: Generate contribution heatmap
        run: python scripts/generate_heatmap.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/hero_banner.svg images/contrib-heatmap.svg
          git diff --cached --quiet || (git commit -m "chore: update profile SVGs [skip ci]" && git push)

